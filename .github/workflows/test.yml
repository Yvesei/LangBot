name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs when a new run is triggered on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code at the current commit
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm package manager with a specific version
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node.js environment with caching enabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Install dependencies using the lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run route integration tests with mocked provider
        run: pnpm run test:integration

      - name: Validate evaluation fixtures (no API calls)
        run: pnpm eval

      # Build the Next.js application
      - name: Build Next.js app
        run: pnpm run build
