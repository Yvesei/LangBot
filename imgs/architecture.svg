<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title description">
  <title id="title">Languify application architecture</title>
  <desc id="description">ChatPage coordinates the chat, sidebar, corrections, and flashcards, and reads and writes browser storage. Voice recording feeds the browser API client. The client calls chat, translation, and transcription routes. A standalone correction route is also available. All routes use shared server helpers to call Mistral text models or Voxtral.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" />
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .section { font-size: 16px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 16px; text-anchor: middle; fill: #334155; }
      .route { font-family: monospace; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #475569; stroke-width: 2; }
    </style>
  </defs>
  <rect width="960" height="840" rx="12" fill="#ffffff" />

  <rect x="20" y="20" width="920" height="290" rx="12" fill="#f0f9ff" stroke="#7dd3fc" />
  <text x="40" y="51" class="section">BROWSER</text>
  <rect x="40" y="74" width="540" height="82" rx="8" fill="#ffffff" stroke="#0284c7" />
  <text x="310" y="106" class="heading">ChatPage, state, and actions</text>
  <text x="310" y="134" class="detail">Chat, sidebar, corrections, and flashcards</text>
  <rect x="620" y="74" width="280" height="82" rx="8" fill="#ffffff" stroke="#0284c7" />
  <text x="760" y="106" class="heading">Browser storage</text>
  <text x="760" y="134" class="detail">Languages, theme, flashcards</text>
  <path d="M 580 115 H 620" class="edge" marker-start="url(#arrow)" />

  <rect x="40" y="202" width="260" height="82" rx="8" fill="#ffffff" stroke="#0284c7" />
  <text x="170" y="234" class="heading">Voice call</text>
  <text x="170" y="262" class="detail">Recording and speech playback</text>
  <rect x="340" y="202" width="560" height="82" rx="8" fill="#ffffff" stroke="#0284c7" />
  <text x="620" y="234" class="heading">Browser API client</text>
  <text x="620" y="262" class="detail">Chat, translation, and transcription requests</text>
  <path d="M 170 156 V 202" class="edge" />
  <path d="M 480 156 V 202" class="edge" />
  <path d="M 300 243 H 340" class="edge" />

  <rect x="20" y="330" width="920" height="280" rx="12" fill="#f0fdf4" stroke="#86efac" />
  <text x="40" y="361" class="section">NEXT.JS SERVER</text>
  <path d="M 620 284 V 382 H 142" class="branch" />
  <path d="M 142 382 V 400" class="edge" />
  <path d="M 367 382 V 400" class="edge" />
  <path d="M 592 382 V 400" class="edge" />
  <rect x="40" y="400" width="205" height="72" rx="8" fill="#ffffff" stroke="#16a34a" />
  <text x="142" y="428" class="route">/api/chat</text>
  <text x="142" y="453" class="detail">Reply and correction</text>
  <rect x="265" y="400" width="205" height="72" rx="8" fill="#ffffff" stroke="#16a34a" />
  <text x="367" y="428" class="route">/api/translate</text>
  <text x="367" y="453" class="detail">Native-language text</text>
  <rect x="490" y="400" width="205" height="72" rx="8" fill="#ffffff" stroke="#16a34a" />
  <text x="592" y="428" class="route">/api/transcribe</text>
  <text x="592" y="453" class="detail">Audio to text</text>
  <rect x="715" y="400" width="205" height="72" rx="8" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4" />
  <text x="817" y="428" class="route">/api/correct</text>
  <text x="817" y="453" class="detail">Standalone endpoint</text>
  <path d="M 142 472 V 498 H 817 V 472 M 367 472 V 498 M 592 472 V 498" class="branch" />
  <path d="M 480 498 V 520" class="edge" />
  <rect x="60" y="520" width="840" height="66" rx="8" fill="#ffffff" stroke="#16a34a" />
  <text x="480" y="547" class="heading">Shared server helpers</text>
  <text x="480" y="573" class="detail">Validation, prompts, provider requests, and in-memory limits</text>

  <rect x="20" y="640" width="920" height="180" rx="12" fill="#fff7ed" stroke="#fdba74" />
  <text x="40" y="671" class="section">MISTRAL AI</text>
  <path d="M 480 586 V 626 M 275 626 H 685" class="branch" />
  <path d="M 275 626 V 696" class="edge" />
  <path d="M 685 626 V 696" class="edge" />
  <rect x="110" y="696" width="330" height="94" rx="8" fill="#ffffff" stroke="#ea580c" />
  <text x="275" y="732" class="heading">Text model</text>
  <text x="275" y="762" class="detail">Chat, corrections, and translation</text>
  <rect x="520" y="696" width="330" height="94" rx="8" fill="#ffffff" stroke="#ea580c" />
  <text x="685" y="732" class="heading">Voxtral</text>
  <text x="685" y="762" class="detail">Audio transcription</text>
</svg>
