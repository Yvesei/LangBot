<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title description">
  <title id="title">Corrections and flashcards</title>
  <desc id="description">Explained corrections are saved in browser storage and repeated word or phrase edits are grouped. Open flashcards to see the original word or phrase. Click to flip to its correction and explanation, and click again to return to the original.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" />
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .heading { font-size: 19px; font-weight: 700; }
      .detail { font-size: 16px; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="370" rx="12" fill="#ffffff" />

  <rect x="30" y="30" width="240" height="90" rx="8" fill="#f0f9ff" stroke="#0284c7" />
  <text x="150" y="66" class="heading">Explained correction</text>
  <text x="150" y="94" class="detail">From a conversation</text>
  <path d="M 270 75 H 330" class="edge" />
  <rect x="330" y="30" width="240" height="90" rx="8" fill="#f0f9ff" stroke="#0284c7" />
  <text x="450" y="66" class="heading">Save in browser</text>
  <text x="450" y="94" class="detail">Keep across reloads</text>
  <path d="M 570 75 H 630" class="edge" />
  <rect x="630" y="30" width="240" height="90" rx="8" fill="#f0f9ff" stroke="#0284c7" />
  <text x="750" y="66" class="heading">Group repeated edits</text>
  <text x="750" y="94" class="detail">By word or phrase</text>

  <path d="M 750 120 V 174 H 220 V 230" class="edge" />
  <text x="450" y="160" class="detail">Open Flashcards</text>
  <rect x="80" y="230" width="280" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" />
  <text x="220" y="267" class="heading">Front of card</text>
  <text x="220" y="298" class="detail">Original word or phrase</text>
  <rect x="540" y="230" width="280" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" />
  <text x="680" y="267" class="heading">Back of card</text>
  <text x="680" y="298" class="detail">Correction and explanation</text>
  <path d="M 360 272 H 540" class="edge" />
  <text x="450" y="258" class="detail">Click to flip</text>
  <path d="M 540 316 H 360" class="edge" />
  <text x="450" y="341" class="detail">Click again</text>
</svg>
